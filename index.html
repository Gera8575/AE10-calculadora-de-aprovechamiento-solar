<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fef9c3">
<title>Calculadora de Potencial Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link
  rel="icon"
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>"
/>
<style>
  :root { --ink:#18181b; --paper:#fffdf7; --amber:#fbbf24; --amber-soft:#fde68a; --mint:#6ee7b7; --screen:#121316; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Space Mono", ui-monospace, monospace; color: var(--ink);
    background-color: #fef9c3;
    background-image: radial-gradient(var(--ink) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .wrap { width: min(100%, 1100px); display: flex; flex-direction: column; gap: 20px; }

  .card { background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); border-radius: 16px; }

  header.card { padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--amber);
          border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .logo svg { width: 24px; height: 24px; }
  .badge { display: inline-block; margin-bottom: 4px; padding: 2px 8px; background: var(--mint); border: 1px solid var(--ink);
           border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  h1 { margin: 0; font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(20px, 3vw, 26px); letter-spacing: -.01em; line-height: 1.05; }

  .btn { font: 700 13px "Space Mono", monospace; color: var(--ink); background: var(--amber); cursor: pointer;
         min-height: 44px; padding: 8px 18px; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink);
         display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation;
         text-decoration: none;
         transition: transform .08s ease, box-shadow .08s ease, background-color .15s ease; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn:hover { background: #fcd34d; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible, summary:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 3px; }

  /* Variante secundaria para el botón de GitHub en la barra inferior */
  .btn-github { background: var(--paper); min-height: 40px; padding: 6px 14px; font-size: 12px; }
  .btn-github:hover { background: #f4f4f5; }

  .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 2px solid var(--ink);
          border-radius: 8px; font-size: 12px; font-weight: 700; background: #f4f4f5; }
  .pill.file { background: var(--amber-soft); }
  #dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); background: #10b981; flex: none; }

  /* Pantalla oscura de alto contraste */
  #term { position: relative; background: var(--screen); color: #f4f4f5; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #27272a;
          border-radius: 12px; padding: 18px 20px; height: min(64vh, 640px); height: min(64dvh, 640px); min-height: 360px;
          overflow-x: auto; overflow-y: auto; overscroll-behavior: contain;
          font: 14px/1.3 "DejaVu Sans Mono", "Cascadia Mono", Menlo, Consolas, "Noto Sans Mono", monospace; }
  #out { font: inherit; }
  /* Cada línea de salida es un bloque: el texto normal se ajusta al ancho; el logo ASCII se reduce para caber entero. */
  .ln { min-height: 1.3em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ln.art { white-space: pre; overflow-wrap: normal; }

  /* Barra de entrada fija bajo la pantalla (el teclado del celular no se cierra entre preguntas) */
  .entrada { display: flex; gap: 10px; align-items: stretch; }
  .campo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 52px;
           background: #e4e4e7; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .campo .sig { font-weight: 800; user-select: none; }
  .campo:focus-within { outline: 3px solid #0ea5e9; outline-offset: 3px; }
  .entrada.activa .campo { background: #facc15; }
  .entrada.activa .campo:not(:focus-within) { animation: pulso 1.2s ease-in-out infinite; }
  @keyframes pulso { 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 5px rgba(14,165,233,.45); } }
  @media (prefers-reduced-motion: reduce) { .entrada.activa .campo:not(:focus-within) { animation: none; } }
  #in { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
        font: 700 16px "Space Mono", monospace; /* 16px evita el zoom automático de iOS */ }
  #in::placeholder { color: #52525b; font-weight: 400; }
  #enviar { min-height: 52px; padding: 0 20px; font-size: 14px; }

  .hint { padding: 0 4px; font-size: 12px; font-weight: 700; color: #3f3f46; line-height: 1.4; }
  .solo-tactil, .solo-vertical { display: none; }
  @media (pointer: coarse) { .solo-tactil { display: inline; } .solo-mouse { display: none; } }

  details.card { padding: 8px 16px; }
  summary { cursor: pointer; font-weight: 700; font-size: 13px; min-height: 44px; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 10px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .summary-label { display: inline-flex; align-items: center; gap: 8px; }
  .summary-label::before { content: "▶"; font-size: 10px; transition: transform .15s ease; }
  details[open] .summary-label::before { transform: rotate(90deg); }
  #fuente { margin: 8px 0 12px; padding: 14px; max-height: 360px; overflow: auto; background: var(--screen); color: #f4f4f5;
            border: 2.5px solid var(--ink); border-radius: 10px; font: 12px/1.4 "DejaVu Sans Mono", Menlo, Consolas, monospace; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: #facc15; border: 2px solid var(--ink); }

  /* ---------- Celulares ---------- */
  @media (max-width: 640px) {
    body { padding: 10px 8px 20px; justify-content: flex-start; }
    .wrap { gap: 12px; }
    .card { box-shadow: 4px 4px 0 var(--ink); border-radius: 14px; }
    header.card { padding: 12px; gap: 10px; }
    .logo { width: 38px; height: 38px; }
    h1 { font-size: 19px; }
    #restart { width: 100%; }
    .panel { padding: 10px; gap: 10px; }
    #term { padding: 10px; font-size: 15px; height: min(50vh, 460px); height: min(50dvh, 460px); min-height: 280px; }
    #enviar { padding: 0 16px; }
    #fuente { font-size: 11px; }
  }
  @media (max-width: 640px) and (orientation: portrait) { .solo-vertical { display: inline; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </div>
      <div>
        <span class="badge">AE10 - Prepatec |C|</span>
        <h1>Calculadora de Potencial Solar</h1>
      </div>
    </div>
    <button id="restart" class="btn" type="button">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span>Reiniciar</span>
    </button>
  </header>

  <section class="card panel">
    <div class="bar">
      <span class="pill"><span id="dot"></span><span id="estado">Listo</span></span>
      <span class="pill file" id="titulo"></span>
    </div>

    <div id="term" role="log" aria-live="polite"><div id="out"></div></div>

    <form id="entrada" class="entrada" autocomplete="off">
      <label class="campo">
        <span class="sig" aria-hidden="true">&gt;_</span>
        <input id="in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="send" aria-label="Tu respuesta">
      </label>
      <button id="enviar" class="btn" type="submit">Enviar</button>
    </form>

    <div class="hint">
      <span class="solo-mouse">Escribe tu respuesta y pulsa Enter.</span>
      <span class="solo-tactil">Toca el recuadro amarillo, escribe y pulsa Enviar.</span>
      <span class="solo-vertical"> Tip: gira el teléfono para ver más grande el logo.</span>
    </div>
  </section>

  <details class="card">
    <summary>
      <span class="summary-label">Ver el código fuente que se está ejecutando</span>
      <a id="github-link" class="btn btn-github" href="https://github.com/TEC409Q/Solarcalc" target="_blank" rel="noopener noreferrer" aria-label="Ver repositorio en GitHub" onclick="event.stopPropagation()">
        <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        <span>Repositorio en GitHub</span>
      </a>
    </summary>
    <pre id="fuente">Cargando…</pre>
  </details>
</div>

<script>
const FUENTE   = 'main.c';     // mismo nombre que en build.sh
const TECLADO  = 'numeric';    // 'numeric' para números; cambia a 'text' si tu programa pide texto
const ART_COLS = 120;          // ancho (en columnas) del logo ASCII, para reducirlo en pantallas angostas

const $ = id => document.getElementById(id);
const term = $('term'), out = $('out'), inp = $('in'), entrada = $('entrada');
const dot = $('dot'), estadoTxt = $('estado');
const tactil = matchMedia('(pointer: coarse)').matches;
let style = '', span = null, ln = null, esc = '', sesion = 0, scrollPend = false, pendiente = null, ratio = 0.6;

$('titulo').textContent = FUENTE;
inp.setAttribute('inputmode', TECLADO);

function estado(texto, color) { estadoTxt.textContent = texto; dot.style.background = color; }
function modoEntrada(modo) {                      // 'espera' | 'lista' | 'fin'
  entrada.classList.toggle('activa', modo === 'lista');
  inp.placeholder = modo === 'lista' ? 'Escribe tu respuesta' : modo === 'fin' ? 'Programa terminado' : 'Esperando al programa…';
}
modoEntrada('espera');

fetch(FUENTE).then(r => r.ok ? r.text() : Promise.reject())
  .then(t => $('fuente').textContent = t)
  .catch(() => $('fuente').textContent = 'No se pudo cargar ' + FUENTE);

/* ---------- Render ANSI por líneas ---------- */
const RE_ART = /[\u2500-\u28FF]/, RE_TEXTO = /[\p{L}\p{N}]/u;

function color256(n) {
  if (n < 16 || n > 231) return '#888';
  const c = n - 16, l = v => v ? 55 + v * 40 : 0;
  return `rgb(${l(Math.floor(c/36))},${l(Math.floor(c%36/6))},${l(c%6)})`;
}
function tamArt() {                               // tamaño de letra para que el logo quepa de lado a lado
  const m = document.createElement('span');
  m.style.cssText = 'position:absolute;left:-9999px;visibility:hidden;white-space:pre;font-size:100px;';
  m.textContent = 'M'.repeat(40); out.appendChild(m);
  const w = m.getBoundingClientRect().width; m.remove(); if (w) ratio = w / 4000;
  const base = parseFloat(getComputedStyle(out).fontSize) || 14;
  const disp = out.clientWidth || 300;
  return Math.max(3, Math.min(base, Math.floor(disp / (ART_COLS * ratio) * 10) / 10));
}
function setArt(l, on) {
  if (!!l._art === on) return;
  l._art = on; l.classList.toggle('art', on); l.style.fontSize = on ? tamArt() + 'px' : '';
}
function nuevaLinea(heredaArt) {
  ln = document.createElement('div'); ln.className = 'ln'; out.appendChild(ln); span = null;
  if (heredaArt) setArt(ln, true);
}
function ansi(params, cmd) {
  if (cmd === 'J' && params === '2') { out.textContent = ''; ln = null; span = null; return; }
  if (cmd !== 'm') return;                        // H, ?25l, ?25h: sin efecto aquí
  const p = params ? params.split(';').map(Number) : [0];
  for (let i = 0; i < p.length; i++) {
    if (p[i] === 0) style = '';
    else if (p[i] === 33) style = 'color:#e5c07b;';
    else if (p[i] === 48 && p[i+1] === 5) { style = `background:${color256(p[i+2])};color:#111;`; i += 2; }
  }
  span = null;
}
function emit(ch) {
  if (!ln) nuevaLinea(false);
  if (RE_ART.test(ch)) setArt(ln, true); else if (RE_TEXTO.test(ch)) setArt(ln, false);
  if (!span) { span = document.createElement('span'); if (style) span.style.cssText = style; ln.appendChild(span); }
  span.textContent += ch;
}
function salto() { const art = ln && ln._art; if (!ln) nuevaLinea(false); nuevaLinea(art); }
function feed(s) {                                // acepta secuencias partidas entre llamadas
  for (const ch of s) {
    if (esc) {
      esc += ch;
      if (esc.length === 2 && ch !== '[') esc = '';
      else if (esc.length > 2 && /[A-Za-z]/.test(ch)) {
        const m = /^\x1b\[([0-9;?]*)([A-Za-z])$/.exec(esc); if (m) ansi(m[1], m[2]); esc = '';
      }
    } else if (ch === '\x1b') esc = ch;
    else if (ch === '\n') salto();
    else emit(ch);
  }
  if (!scrollPend) { scrollPend = true; requestAnimationFrame(() => { scrollPend = false; term.scrollTop = term.scrollHeight; }); }
}
new ResizeObserver(() => {                        // al girar el teléfono o cambiar el tamaño, reajusta el logo
  const t = tamArt() + 'px';
  out.querySelectorAll('.ln.art').forEach(l => l.style.fontSize = t);
}).observe(term);

/* ---------- Entrada (lo que usa scanf) ---------- */
function leerLinea(id) {
  if (id !== sesion) return new Promise(() => {});
  return new Promise(resolve => {
    pendiente = { id, resolve };
    modoEntrada('lista'); estado('Esperando tu respuesta', '#facc15');
    if (!tactil) inp.focus();                     // en celular no se abre el teclado solo: lo abre el toque
  });
}
$('enviar').addEventListener('mousedown', e => e.preventDefault());   // el botón no le quita el foco al campo
entrada.addEventListener('submit', e => {
  e.preventDefault();
  inp.focus();                                    // mantiene abierto el teclado entre preguntas
  if (!pendiente) return;
  const { resolve } = pendiente; pendiente = null;
  const v = inp.value; inp.value = '';
  modoEntrada('espera'); estado('Ejecutando', '#38bdf8');
  feed(v + '\n'); resolve(v);
});
term.addEventListener('click', () => { if (!tactil) inp.focus(); });

/* ---------- Carga y ejecución del .wasm ---------- */
const cargarScript = () => new Promise((ok, fallo) => {
  if (window.crearPrograma) return ok();
  const s = document.createElement('script');
  s.src = 'programa.js'; s.onload = ok; s.onerror = fallo; document.head.appendChild(s);
});

async function ejecutar() {
  const id = ++sesion;
  pendiente = null; inp.value = ''; modoEntrada('espera');
  out.textContent = ''; ln = null; span = null; style = ''; esc = '';
  estado('Ejecutando', '#38bdf8');
  const dec = new TextDecoder();
  try {
    await cargarScript();
    const cfg = {
      activo: () => id === sesion,
      leerLinea: () => leerLinea(id),
      print:    t => { if (id === sesion) feed(t + '\n'); },
      printErr: t => { if (id === sesion) feed(t + '\n'); },
      onExit: code => {
        if (id !== sesion) return;
        feed('\n[Programa terminado con código ' + code + ']\n');
        estado('Terminado', '#a1a1aa'); modoEntrada('fin');
      },
    };
    const salida = c => { if (id === sesion) feed(dec.decode(Uint8Array.of(c & 255), { stream: true })); };
    cfg.preRun = [m => { if (m.FS) m.FS.init(null, salida, salida); }];
    await crearPrograma(cfg);
  } catch (e) {
    if (id === sesion) {
      estado('Error', '#ef4444'); modoEntrada('fin');
      feed('No se pudo cargar programa.js / programa.wasm.\n' +
        'Se generan al compilar (build.sh o GitHub Actions) y la página debe abrirse por http(s), no con file://.\n');
    }
  }
}
$('restart').onclick = ejecutar;
ejecutar();
</script>
</body>
</html>
