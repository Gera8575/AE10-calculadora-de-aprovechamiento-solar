
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de potencial solar</title>
<style>
  :root { --page:#e9e6df; --ink:#2b2a27; --bar:#cfcac0; --bg:#17191c; --fg:#d8dadd; --accent:#e5a93b; }
  @media (prefers-color-scheme: dark) { :root { --page:#0f1012; --ink:#cfd1d4; --bar:#26282c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px "Segoe UI",system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 12px; gap:14px; }
  .win, details { width:min(100%,980px); }
  .win { border-radius:10px; overflow:hidden; background:var(--bg); box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--bar); }
  .dot { width:11px; height:11px; border-radius:50%; background:#e0524a; }
  .dot:nth-child(2){background:#e5b53b} .dot:nth-child(3){background:#4caf6a}
  .t { flex:1; margin-left:6px; }
  button { font:inherit; color:inherit; background:transparent; border:1px solid currentColor;
           border-radius:5px; padding:2px 10px; cursor:pointer; }
  button:focus-visible, #in:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #term { color:var(--fg); padding:14px 16px; height:min(75vh,720px); overflow:auto; cursor:text;
          font:13px/1.15 "DejaVu Sans Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono",monospace; }
  #out { margin:0; font:inherit; white-space:pre; }
  #in { font:inherit; color:var(--accent); background:transparent; border:0; padding:0; width:1ch; caret-color:var(--accent); }
  details pre { overflow:auto; max-height:360px; padding:12px; border-radius:8px; background:var(--bg); color:var(--fg);
                font:12px/1.4 "DejaVu Sans Mono",Menlo,Consolas,monospace; }
  summary { cursor:pointer; }
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="t" id="titulo"></span>
    <button id="restart" type="button">Reiniciar</button>
  </div>
  <div id="term" aria-live="polite"><pre id="out"></pre></div>
</div>
<details>
  <summary>Ver el código fuente que se está ejecutando</summary>
  <pre id="fuente">Cargando…</pre>
</details>
 
<script>
const FUENTE = 'main.c';   // mismo nombre que en build.sh
document.getElementById('titulo').textContent = FUENTE;
 
const term = document.getElementById('term'), out = document.getElementById('out');
let style = '', span = null, esc = '', activeInput = null, sesion = 0, scrollPend = false;
 
fetch(FUENTE).then(r => r.ok ? r.text() : Promise.reject())
  .then(t => document.getElementById('fuente').textContent = t)
  .catch(() => document.getElementById('fuente').textContent = 'No se pudo cargar ' + FUENTE);
 
/* ---------- Render ANSI ---------- */
function color256(n) {
  if (n < 16 || n > 231) return '#888';
  const c = n - 16, l = v => v ? 55 + v * 40 : 0;
  return `rgb(${l(Math.floor(c/36))},${l(Math.floor(c%36/6))},${l(c%6)})`;
}
function ansi(params, cmd) {
  if (cmd === 'J' && params === '2') { out.textContent = ''; span = null; return; }
  if (cmd !== 'm') return;                       // H, ?25l, ?25h: sin efecto aquí
  const p = params ? params.split(';').map(Number) : [0];
  for (let i = 0; i < p.length; i++) {
    if (p[i] === 0) style = '';
    else if (p[i] === 33) style = 'color:#e5c07b;';
    else if (p[i] === 48 && p[i+1] === 5) { style = `background:${color256(p[i+2])};color:#111;`; i += 2; }
  }
  span = null;
}
function emit(ch) {
  if (!span) { span = document.createElement('span'); if (style) span.style.cssText = style; out.appendChild(span); }
  span.textContent += ch;
}
function feed(s) {                               // acepta secuencias partidas entre llamadas
  for (const ch of s) {
    if (esc) {
      esc += ch;
      if (esc.length === 2 && ch !== '[') esc = '';
      else if (esc.length > 2 && /[A-Za-z]/.test(ch)) {
        const m = /^\x1b\[([0-9;?]*)([A-Za-z])$/.exec(esc); if (m) ansi(m[1], m[2]); esc = '';
      }
    } else if (ch === '\x1b') esc = ch;
    else emit(ch);
  }
  if (!scrollPend) { scrollPend = true; requestAnimationFrame(() => { scrollPend = false; term.scrollTop = term.scrollHeight; }); }
}
 
/* ---------- Entrada (lo que usa scanf) ---------- */
function leerLinea(id) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.id = 'in'; input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('aria-label', 'Respuesta');
    span = null; out.appendChild(input); activeInput = input; input.focus();
    input.addEventListener('input', () => input.style.width = Math.max(1, input.value.length + 1) + 'ch');
    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || id !== sesion) return;
      const v = input.value; input.remove(); activeInput = null;
      feed(v + '\n'); resolve(v);
    });
  });
}
 
/* ---------- Carga y ejecución del .wasm ---------- */
const cargarScript = () => new Promise((ok, fallo) => {
  if (window.crearPrograma) return ok();
  const s = document.createElement('script');
  s.src = 'programa.js'; s.onload = ok; s.onerror = fallo; document.head.appendChild(s);
});
 
async function ejecutar() {
  const id = ++sesion;
  if (activeInput) { activeInput.remove(); activeInput = null; }
  out.textContent = ''; style = ''; span = null; esc = '';
  const dec = new TextDecoder();
  try {
    await cargarScript();
    const cfg = {
      leerLinea: () => leerLinea(id),
      print:    t => { if (id === sesion) feed(t + '\n'); },
      printErr: t => { if (id === sesion) feed(t + '\n'); },
      onExit: code => { if (id === sesion) feed('\n[Programa terminado con código ' + code + ']\n'); },
    };
    const salida = c => { if (id === sesion) feed(dec.decode(Uint8Array.of(c & 255), { stream: true })); };
    cfg.preRun = [() => { if (cfg.FS) cfg.FS.init(null, salida, salida); }];
    await crearPrograma(cfg);
  } catch (e) {
    if (id === sesion) feed('No se pudo cargar programa.js / programa.wasm.\n' +
      'Se generan al compilar (build.sh o GitHub Actions) y la página debe abrirse por http(s), no con file://.\n');
  }
}
document.getElementById('restart').onclick = ejecutar;
term.addEventListener('click', () => activeInput && activeInput.focus());
ejecutar();
</script>
</body>
</html>
